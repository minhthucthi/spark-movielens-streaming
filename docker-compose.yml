name: bigdata-lab02

x-kafka-env: &kafka-env
  CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
  KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:9094"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
  KAFKA_LOG_DIRS: "/var/lib/kafka/data"
  KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"

services:
  kafka-1:
    image: apache/kafka:latest
    container_name: lab02-kafka-1
    hostname: kafka-1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "1"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092,INTERNAL://kafka-1:9094"
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    networks:
      - lab

  kafka-2:
    image: apache/kafka:latest
    container_name: lab02-kafka-2
    hostname: kafka-2
    ports:
      - "9192:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "2"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9192,INTERNAL://kafka-2:9094"
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    networks:
      - lab

  kafka-3:
    image: apache/kafka:latest
    container_name: lab02-kafka-3
    hostname: kafka-3
    ports:
      - "9292:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "3"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9292,INTERNAL://kafka-3:9094"
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    networks:
      - lab

  spark:
    build: .
    container_name: lab02-spark
    hostname: spark
    environment:
      KAFKA_SERVERS: "kafka-1:9094,kafka-2:9094,kafka-3:9094"
      PYTHONDONTWRITEBYTECODE: "1"
    command: jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --IdentityProvider.token=''
    working_dir: /workspace
    volumes:
      - .:/workspace
    ports:
      - "127.0.0.1:8888:8888"
      - "4040:4040"
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    networks:
      - lab

networks:
  lab:

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
